<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAMO</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./src/output.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="./src/all.min.css" />
  </head>
  <body class="h-[500vh] bg-mamo-black text-white">
    <header
      class="border-mamo-gold bg-mamo-black sticky top-0 z-50 border-be-2 text-white"
    >
      <div
        class="relative mx-auto flex h-15 max-w-93.75 items-center justify-between gap-7 px-5 md:max-w-170 lg:h-19 lg:max-w-250 lg:gap-5 xl:max-w-375 xl:px-15"
      >
        <a href="#" id="logo" class="mbe-0.8 me-auto text-sm hover:opacity-75">
          <img
            src="./img/logo.svg"
            alt="mamo logo"
            class="w-15 lg:w-20"
            width="380"
            height="233"
          />
        </a>

        <nav
          class="bg-mamo-black border-mamo-gold absolute top-full left-0 z-30 mx-auto flex max-h-0 w-full flex-col items-center justify-between gap-2.5 overflow-hidden rounded-b-2xl border-x-2 border-be-2 px-5 transition-all duration-600 lg:static lg:top-auto lg:left-auto lg:z-0 lg:m-0 lg:me-5 lg:max-h-full lg:h-full lg:w-auto lg:translate-none lg:flex-row lg:rounded-b-none lg:border-none lg:bg-transparent lg:p-0"
        >
          <ul
            class="mbe-2 h-full w-full uppercase md:text-xl lg:me-10 lg:mbe-0 lg:flex lg:items-center lg:justify-end lg:gap-6 xl:gap-10"
          >
            <li
              class="hover:text-mamo-gold lg:hover:border-mamo-gold border-b py-3.5 transition-all hover:ps-3 md:py-3 lg:flex lg:h-full lg:items-center lg:border-b-4 lg:border-transparent lg:p-0 lg:hover:border-b-4 lg:hover:p-0"
            >
              <a href="#" class="block w-full">Home</a>
            </li>
            <li
              class="hover:text-mamo-gold lg:hover:border-mamo-gold border-b py-3.5 transition-all hover:ps-3 md:py-3 lg:flex lg:h-full lg:items-center lg:border-b-4 lg:border-transparent lg:p-0 lg:hover:border-b-4 lg:hover:p-0"
            >
              <a href="#about" class="block w-full">About</a>
            </li>
            <li
              class="hover:text-mamo-gold lg:hover:border-mamo-gold border-b py-3.5 transition-all hover:ps-3 md:py-3 lg:flex lg:h-full lg:items-center lg:border-b-4 lg:border-transparent lg:p-0 lg:hover:border-b-4 lg:hover:p-0"
            >
              <a href="#subjects" class="block w-full">Subjects</a>
            </li>
            <li
              class="hover:text-mamo-gold lg:hover:border-mamo-gold border-b py-3.5 transition-all hover:ps-3 md:py-3 lg:flex lg:h-full lg:items-center lg:border-b-4 lg:border-transparent lg:p-0 lg:hover:border-b-4 lg:hover:p-0"
            >
              <a href="#pricing" class="block w-full">Pricing</a>
            </li>
            <li
              class="hover:text-mamo-gold lg:hover:border-mamo-gold border-b py-3.5 transition-all hover:ps-3 md:py-3 lg:flex lg:h-full lg:items-center lg:border-b-4 lg:border-transparent lg:p-0 lg:hover:border-b-4 lg:hover:p-0"
            >
              <a href="#reviews" class="block w-full">Reviews</a>
            </li>
            <li
              class="hover:text-mamo-gold lg:hover:border-mamo-gold border-b py-3.5 transition-all hover:ps-3 md:py-3 lg:flex lg:h-full lg:items-center lg:border-b-4 lg:border-transparent lg:p-0 lg:hover:border-b-4 lg:hover:p-0"
            >
              <a href="#faq" class="block w-full">FAQ</a>
            </li>
          </ul>
        </nav>
        <button class="text-mamo-gold cursor-pointer text-xl">
          <i class="fa-solid fa-sun" id="theme"></i>
        </button>

        <button
          class="group relative flex cursor-pointer flex-col space-y-1.5 lg:hidden"
          id="burger-icon"
        >
          <span
            class="group-hover:bg-mamo-gold h-0.75 w-6.5 rounded-full bg-white transition-all duration-300"
          ></span>
          <span
            class="group-hover:bg-mamo-gold h-0.75 w-6.5 rounded-full bg-white transition-all duration-300"
          ></span>
          <span
            class="group-hover:bg-mamo-gold h-0.75 w-6.5 rounded-full bg-white transition-all duration-300"
          ></span>
        </button>
      </div>
    </header>
    
    <script src="main.js"></script>
  </body>
</html>
